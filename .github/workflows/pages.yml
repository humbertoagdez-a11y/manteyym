name: Verificar y publicar ManteYym

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias exactas
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Typecheck y compilación
        run: npm run build
      - name: Verificar assets referenciados en dist
        run: npm run check:dist
      - name: Verificar tildes en textos visibles
        run: npm run check:accents
      - name: Subir artefacto de Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
